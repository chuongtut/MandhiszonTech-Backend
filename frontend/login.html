<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101a33">
    <title>Administrator login | MandhiszonTech</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="api-config.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>
    <main class="auth-view">
        <div class="auth-brand">
            <a class="brand brand-light" href="index.html" aria-label="MandhiszonTech">
                <span class="brand-mark">M</span><span class="brand-name">mandhiszon<span>tech</span></span>
            </a>
        </div>
        <div class="auth-layout">
            <section class="auth-intro">
                <p class="eyebrow">ADMINISTRATION PORTAL</p>
                <h1>Good work starts with a clear view.</h1>
                <p>Sign in to keep your services, projects, and stories in order.</p>
                <div class="auth-decoration" aria-hidden="true">
                    <span class="decor-orbit orbit-one"></span><span class="decor-orbit orbit-two"></span>
                    <span class="decor-orbit orbit-three"></span><span class="decor-dot"></span>
                </div>
            </section>
            <section class="login-card">
                <div class="login-card-heading">
                    <span class="login-icon" aria-hidden="true">M</span>
                    <p class="eyebrow">WELCOME BACK</p>
                    <h2>Administrator sign in</h2>
                    <p>Use your administrator account to continue.</p>
                </div>
                <form id="login-form">
                    <label class="field-label" for="email">Email address</label>
                    <input id="email" name="email" type="email" autocomplete="username"
                           placeholder="admin@mandhiszontech.com" required>
                    <label class="field-label" for="password">Password</label>
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" placeholder="Enter your password" required>
                    <p class="form-message is-hidden" id="login-message" role="alert"></p>
                    <button class="button button-primary login-button" id="login-button" type="submit">
                        <span>Sign in to dashboard</span><span aria-hidden="true">&rarr;</span>
                    </button>
                </form>
                <p class="login-footnote"><span class="lock-icon" aria-hidden="true"></span> Secure administrator access</p>
            </section>
        </div>
        <p class="auth-copyright">&copy; <span id="current-year"></span> MandhiszonTech. All rights reserved.</p>
    </main>
</body>
</html>
